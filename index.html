<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>С Днём Рождения, Маргарита Александровна!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <script src='https://cdn.jsdelivr.net/npm/typed.js@2.0.11'></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0d0d0d;
      --white: #f5f0e8;
      --yellow: #FFE135;
      --pink: #FF3CAC;
      --cyan: #00F5D4;
      --purple: #7B2FBE;
    }

    body {
      background-color: var(--black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,225,53,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,225,53,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      animation: drift 8s ease-in-out infinite alternate;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--pink); top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; background: var(--purple); bottom: -80px; right: -80px; animation-delay: -3s; }
    .blob-3 { width: 200px; height: 200px; background: var(--cyan); top: 50%; right: 10%; animation-delay: -5s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 20px) scale(1.1); }
    }

    .scene {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .envelope {
      width: 380px;
      background: var(--white);
      border: 3px solid var(--yellow);
      box-shadow: 8px 8px 0 var(--yellow);
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      transform: rotate(-4deg);
    }
    .envelope:hover { transform: rotate(0deg) scale(1.02); box-shadow: 12px 12px 0 var(--yellow); }
    .envelope.clicked { transform: rotate(0deg) scale(1) !important; }
    .envelope.submitted { pointer-events: none; }

    .env-sender {
      position: absolute;
      top: 10px;
      left: 14px;
      z-index: 6;
      line-height: 1.4;
    }
    .env-sender-label {
      font-family: 'Unbounded', sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--purple);
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
    }
    .env-sender-name {
      font-family: 'Caveat', cursive;
      font-size: 28px;
      font-weight: 600;
      color: var(--black);
      display: block;
    }

    .stamp {
      position: absolute;
      top: 8px; right: 14px;
      width: 52px; height: 52px;
      border: 3px solid var(--cyan);
      background: rgba(0,245,212,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      font-size: 8px;
      font-weight: 900;
      color: var(--cyan);
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.3;
      z-index: 6;
      transition: all 0.3s ease;
    }
    .stamp.vanish { width: 0; height: 0; opacity: 0; overflow: hidden; }

    .env-flap {
      width: 100%;
      height: 120px;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid var(--yellow);
      cursor: pointer;
    }
    .env-flap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(135deg, #e8ddd0 50%, #d4c9ba 50%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }
    .env-flap.opened::before { transform: rotateX(180deg); }

    .wax-seal {
      position: absolute;
      top: 98px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      background: var(--pink);
      border: 3px solid var(--black);
      border-radius: 50%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: var(--black);
      box-shadow: 3px 3px 0 var(--black);
      transition: all 0.3s ease;
    }
    .wax-seal.vanish {
      width: 0; height: 0;
      opacity: 0;
      transition: all 0.3s ease 0.2s;
    }

    .env-body {
      padding: 30px 24px 24px;
      position: relative;
      z-index: 5;
      background: var(--white);
    }
    .env-body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 18px,
        rgba(255,225,53,0.06) 18px,
        rgba(255,225,53,0.06) 19px
      );
      pointer-events: none;
    }

    .env-corner {
      position: absolute;
      width: 14px; height: 14px;
      border: 3px solid var(--yellow);
    }
    .env-corner.tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
    .env-corner.tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
    .env-corner.bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
    .env-corner.br { bottom: 6px; right: 6px; border-left: none; border-top: none; }

    .ask-name {
      text-align: center;
      position: relative;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease 0.6s;
    }
    .ask-name.visible {
      opacity: 1;
      pointer-events: all;
    }
    .ask-name p {
      font-family: 'Caveat', cursive;
      font-size: 22px;
      color: var(--black);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .ask-name input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 3px solid var(--pink);
      outline: none;
      font-family: 'Caveat', cursive;
      font-size: 22px;
      text-align: center;
      color: var(--black);
      padding: 4px 8px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .ask-name input:focus { border-color: var(--purple); }
    .ask-name input::placeholder { color: #aaa; }

    .btn-ok {
      display: none;
      background: var(--pink);
      color: var(--black);
      border: 3px solid var(--black);
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 28px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--black);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-ok:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--black); }
    .btn-ok:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--black); }

    @keyframes fadeInHint { to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    .label-8march {
      position: absolute;
      bottom: -56px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .label-8march span {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--yellow);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeInHint 1s ease 2s forwards, pulse 2s ease-in-out 3s infinite;
    }

    .paper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -200vh) rotate(8deg);
      width: min(440px, 92vw);
      background: var(--white);
      border: 3px solid var(--yellow);
      box-shadow: 10px 10px 0 var(--yellow);
      padding: 36px 28px 44px;
      z-index: 100;
      transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1) 1s, opacity 0.3s ease;
      opacity: 0;
    }
    .paper.show {
      transform: translate(-50%, -50%) rotate(0deg);
      opacity: 1;
    }
    .paper::before {
      content: '';
      position: absolute;
      inset: 44px 20px 20px;
      background: repeating-linear-gradient(
        transparent,
        transparent 28px,
        rgba(255,60,172,0.12) 28px,
        rgba(255,60,172,0.12) 29px
      );
      pointer-events: none;
    }

    .paper-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 3px dashed var(--pink);
    }
    .paper-date {
      display: inline-block;
      background: var(--pink);
      color: var(--black);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 3px;
      padding: 4px 14px;
      border: 2px solid var(--black);
      box-shadow: 3px 3px 0 var(--black);
      margin-bottom: 12px;
    }
    .paper-name {
      font-family: 'Caveat', cursive;
      font-size: 28px;
      color: var(--purple);
      font-weight: 600;
      line-height: 1.2;
    }

    #message {
      font-family: 'Caveat', cursive;
      font-size: 19px;
      line-height: 1.7;
      color: #2a1a3a;
      position: relative;
      z-index: 1;
    }

    .deco-divider {
      text-align: center;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 3px dashed var(--cyan);
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 8px;
      color: var(--cyan);
    }

    .close-paper {
      position: absolute;
      top: -16px; right: -16px;
      width: 36px; height: 36px;
      background: var(--yellow);
      border: 3px solid var(--black);
      box-shadow: 3px 3px 0 var(--black);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 900;
      font-family: 'Unbounded', sans-serif;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .close-paper:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--black); }
    .close-paper:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--black); }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 99;
      backdrop-filter: blur(4px);
    }
    .overlay.show { display: block; }

    canvas#confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
    }
  </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<canvas id="confetti"></canvas>

<div class="overlay" id="overlay"></div>

<div class="paper" id="paper">
  <div class="close-paper" id="closePaper">X</div>
  <div class="paper-header">
    <div class="paper-date">С ДНЁМ РОЖДЕНИЯ</div>
    <div class="paper-name" id="paperName">Маргарита Александровна</div>
  </div>
  <span id="message"></span>
  <div class="deco-divider">* * *</div>
</div>

<div class="scene">
  <div class="envelope" id="envelope">

    <div class="env-sender">
      <span class="env-sender-label">от</span>
      <span class="env-sender-name">ученика</span>
    </div>

    <div class="stamp" id="stamp">С<br>ДР</div>

    <div class="env-flap" id="envFlap"></div>

    <div class="wax-seal" id="waxSeal">S</div>

    <div class="env-body">
      <div class="env-corner tl"></div>
      <div class="env-corner tr"></div>
      <div class="env-corner bl"></div>
      <div class="env-corner br"></div>

      <div class="ask-name" id="askName">
        <p>Подтвердите имя получателя</p>
        <input type="text" id="nameInput" placeholder="Маргарита Александровна" autocomplete="off" value="Маргарита Александровна">
        <button class="btn-ok" id="btnOk">Открыть</button>
      </div>
    </div>
  </div>

  <div class="label-8march">
    <span>нажмите на конверт</span>
  </div>
</div>

<script>
  const envelope = document.getElementById('envelope');
  const envFlap = document.getElementById('envFlap');
  const waxSeal = document.getElementById('waxSeal');
  const stamp = document.getElementById('stamp');
  const askName = document.getElementById('askName');
  const nameInput = document.getElementById('nameInput');
  const btnOk = document.getElementById('btnOk');
  const paper = document.getElementById('paper');
  const paperName = document.getElementById('paperName');
  const overlay = document.getElementById('overlay');
  const closePaper = document.getElementById('closePaper');

  let opened = false;
  let submitted = false;

  // сразу подставляем имя в заголовок письма
  paperName.textContent = 'Маргарита Александровна';

  envelope.addEventListener('click', () => {
    if (submitted) return;
    if (!opened) {
      opened = true;
      envelope.classList.add('clicked');
      envFlap.classList.add('opened');
      waxSeal.classList.add('vanish');
      stamp.classList.add('vanish');
      setTimeout(() => {
        askName.classList.add('visible');
        nameInput.focus();
      }, 400);
    }
  });

  // если пользователь меняет имя — можно, но по умолчанию уже стоит нужное
  nameInput.addEventListener('input', () => {
    const val = nameInput.value.trim();
    paperName.textContent = val.length >= 1 ? val : 'Маргарита Александровна';
    btnOk.style.display = val.length >= 2 ? 'inline-block' : 'none';
  });

  // кнопка сразу видна, т.к. имя уже введено
  btnOk.style.display = 'inline-block';

  let typedInstance = null;

  btnOk.addEventListener('click', (e) => {
    e.stopPropagation();
    if (submitted) return;
    submitted = true;

    envelope.classList.add('submitted');

    setTimeout(() => {
      overlay.classList.add('show');
      paper.classList.add('show');

      if (typedInstance) { typedInstance.destroy(); }
      document.querySelector('#message').innerHTML = '';

      typedInstance = new Typed('#message', {
        strings: [
    "Дорогая Маргарита Александровна!^600 Поздравляю Вас с Днём Рождения!^800 Спасибо Вам за терпение, за науку и за то, что когда-то объясняли нам физику так, что даже самые сложные задачи становились понятными.^1000 Пусть каждый день приносит радость, здоровье не подводит, а близкие люди всегда будут рядом.^1000 Счастья, тепла и долгих лет жизни!^1500",
    "^500 Желаю Вам крепкого здоровья, благополучия и хорошего настроения.^800 Пусть родные радуют успехами, а жизнь — приятными сюрпризами.^1000 Спасибо за Ваш труд и доброту!^1500"
        ],
        typeSpeed: 45,
        showCursor: true,
        cursorChar: '|',
        loop: false,
        onComplete: (self) => {
          setTimeout(() => { self.cursor.style.display = 'none'; }, 800);
        },
      });

      launchConfetti();
    }, 300);
  });

  function closeLetter() {
    paper.classList.remove('show');
    overlay.classList.remove('show');

    setTimeout(() => {
      envelope.classList.remove('submitted', 'clicked');
      envFlap.classList.remove('opened');
      waxSeal.classList.remove('vanish');
      stamp.classList.remove('vanish');
      askName.classList.remove('visible');
      nameInput.value = 'Маргарита Александровна';
      paperName.textContent = 'Маргарита Александровна';
      document.querySelector('#message').innerHTML = '';
      opened = false;
      submitted = false;
    }, 400);
  }

  closePaper.addEventListener('click', closeLetter);
  overlay.addEventListener('click', closeLetter);

  function launchConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#FFE135','#FF3CAC','#00F5D4','#7B2FBE','#f5f0e8','#FF6B6B'];
    const pieces = Array.from({length: 120}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      r: Math.random() * 8 + 4,
      d: Math.random() * 4 + 1,
      color: colors[Math.floor(Math.random() * colors.length)],
      tiltAngle: Math.random() * Math.PI * 2,
      tiltSpeed: Math.random() * 0.1 + 0.05,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
    }));

    let frame = 0;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (p.shape === 'circle') {
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.tiltAngle);
          ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          ctx.restore();
        }
      });
      pieces.forEach(p => {
        p.tiltAngle += p.tiltSpeed;
        p.y += p.d + Math.sin(p.tiltAngle) * 0.8;
        p.x += Math.sin(p.tiltAngle) * 1.2;
        if (p.y > canvas.height) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }
      });
      frame++;
      if (frame < 300) requestAnimationFrame(draw);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    draw();
  }
</script>
</body>
</html>
